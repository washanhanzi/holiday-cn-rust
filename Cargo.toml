[package]
name = "holiday-cn"
version = "0.2.20260915142602"
edition = "2021"
description = "Chinese holiday library"
license = "MIT"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
once_cell = "1.21.4"
dashmap = "6.2.1"
time = { version = "0.3.55", features = [
    "parsing",
    "formatting",
    "macros",
    "local-offset",
] }

[build-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
