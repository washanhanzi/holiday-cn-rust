name: Update Submodule

on:
  # Re-enable this workflow in Actions if GitHub disables it for inactivity.
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:

concurrency:
  group: holiday-data-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          submodules: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Update holiday data
        id: update
        run: bash scripts/update-data.sh
      - name: Bump version and verify
        if: steps.update.outputs.changed == 'true'
        run: |
          python3 scripts/bump-version.py
          cargo check
          cargo test --locked --all-targets
          cargo package --locked --allow-dirty
      - name: Commit and push
        id: commit
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- holiday-cn Cargo.toml Cargo.lock
          git diff --cached --check
          git commit -m "chore: update holiday data and release version"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      commit: ${{ needs.update.outputs.commit }}
    secrets: inherit
