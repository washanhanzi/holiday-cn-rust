name: Publish Release

on:
  workflow_call:
    inputs:
      commit:
        description: Exact commit to test and publish
        required: true
        type: string
    secrets:
      CRATES_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ inputs.commit || github.sha }}

  publish:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: holiday-crate-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          submodules: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate committed version and tag
        id: release
        run: |
          version=$(python3 scripts/bump-version.py --check)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish crate (skip already published versions on retry)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          status=$(curl --retry 3 --silent --show-error --output /tmp/crate.json --write-out '%{http_code}' "https://crates.io/api/v1/crates/holiday-cn/$VERSION")
          case "$status" in
            200) echo "Crate version already published" ;;
            404) cargo publish --locked ;;
            *) echo "Registry check failed: HTTP $status" >&2; exit 1 ;;
          esac
      - uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.release.outputs.version }}
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ inputs.commit || github.sha }}
          generate_release_notes: true
          make_latest: true
